# Exercise 3 — The hardened Kubernetes Deployment for cart
#
# Goal: A COMPLETE, applyable Deployment + Service + supporting objects that pass
#       a production-readiness review. Every field here is here for a reason, and
#       a reviewer will ask "why this value?" for each — the comments answer that.
#       This is the manifest the mini-project's Helm chart templates.
#
# Estimated time: 45 minutes. Applyable to a Kind cluster.
#
# APPLY
#
#   kubectl apply -f exercise-03-cart-deployment.yaml
#   kubectl rollout status deployment/cart
#   kubectl get pods -l app=cart
#   # zero-drop deploy demo (fire load in another terminal first):
#   kubectl rollout restart deployment/cart
#
# NOTE: this assumes an image `ghcr.io/crunchmesh/cart:1.0.0` that serves the gRPC
# cart on :50051 and HTTP health on :8080 (the Exercise-2 behavior folded into the
# gRPC service). Swap the image for your own build. The cart_db Secret is created
# separately (see the Secret stub at the bottom).
#
# ACCEPTANCE CRITERIA
#
#   [ ] Deployment has resource REQUESTS and LIMITS (both).
#   [ ] Liveness, readiness, and startup probes are all present and correct
#       (readiness/liveness check SELF only — no dependency checks).
#   [ ] A non-root SecurityContext (runAsNonRoot, no privilege escalation, dropped caps).
#   [ ] terminationGracePeriodSeconds + a preStop sleep (dodges the readiness race).
#   [ ] A ServiceAccount, a PodDisruptionBudget, and 3 replicas.
#   [ ] DB credentials come from a Secret, never baked in, never logged.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart
  labels:
    app: cart
# An explicit identity for the pod. Minimal now; the seed of the SPIFFE/SPIRE
# workload identity story in Week 21. Even an empty ServiceAccount is better than
# silently using `default`.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app: cart
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: marketplace
spec:
  # 3 replicas so a single pod loss (or a rolling step) never drops the service
  # to zero. Paired with the PodDisruptionBudget below.
  replicas: 3
  selector:
    matchLabels:
      app: cart
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never go below full capacity during a deploy; add one new pod at a time.
      # This, plus readiness gating, is what makes the deploy zero-drop.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cart
        app.kubernetes.io/name: cart
    spec:
      serviceAccountName: cart
      # Give the process time to drain on SIGTERM. Must exceed the app's bounded
      # drain (Exercise 2 used 25s) plus the preStop sleep.
      terminationGracePeriodSeconds: 40
      securityContext:
        # Pod-level: run as a non-root user and group; seccomp on.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cart
          image: ghcr.io/crunchmesh/cart:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: health
              containerPort: 8080
          # --- Configuration: from env (twelve-factor III), secret from a Secret.
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4317"
            - name: CART_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cart-db
                  key: url
            # NOTE: there is deliberately NO CATALOG_DATABASE_URL here — cart owns
            # only cart_db and reaches catalog over gRPC (Week 4 database-per-service).
            - name: CATALOG_GRPC_ADDR
              value: "catalog:50051"
          # --- Resources: BOTH requests (scheduling) and limits (blast-radius cap).
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              # CPU over-limit -> throttling; memory over-limit -> OOMKill. The
              # memory limit caps a leak's blast radius to this pod, not the node.
              cpu: "500m"
              memory: "256Mi"
          # --- Container-level security hardening.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # --- Startup probe: gates liveness/readiness while the process boots
          # (cache warm, DB pool prime). A slow start won't trip liveness early.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 3
            failureThreshold: 20   # up to 60s to start before we give up
          # --- Liveness: "is the process wedged?" Self only. Restart on fail.
          # NEVER check a dependency here — a dependency outage must not restart us.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # --- Readiness: "can I serve traffic now?" Self only. Remove from
          # endpoints on fail (NOT restart). Flips to not-ready during drain.
          # NEVER check catalog/db here — that causes the conflation outage.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # --- preStop: sleep to let the endpoints controller remove this pod
          # from the Service BEFORE SIGTERM, dodging the readiness-removal race.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  labels:
    app: cart
spec:
  selector:
    app: cart
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: health
      port: 8080
      targetPort: health
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cart
spec:
  # During voluntary disruptions (node drains, cluster upgrades) keep at least 2
  # of 3 replicas up. A drain can't take cart to zero.
  minAvailable: 2
  selector:
    matchLabels:
      app: cart
---
# The DB credential as a Secret. In a real cluster this is created out-of-band
# (sealed-secrets, external-secrets, or `kubectl create secret`), NEVER committed
# with a real value. Shown here as a stub so the manifest is self-contained.
apiVersion: v1
kind: Secret
metadata:
  name: cart-db
type: Opaque
stringData:
  # Replace at deploy time from your secret store. base64 in a Secret is encoding,
  # not encryption — anyone with `get secret` reads it, so guard RBAC accordingly.
  url: "postgres://cart:CHANGE_ME@cart-db:5432/cart?sslmode=require"
